name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: format, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Test workspaces with coverage
        run: npm run test --workspaces --if-present -- --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Build workspaces
        run: npm run build --workspaces --if-present

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npx playwright test --reporter=list
        env:
          CI: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage
            frontend/web/coverage
            frontend/admin/coverage
            backend/api/coverage
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
