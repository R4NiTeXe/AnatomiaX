name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: format, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm

      # Fail fast before the install: neither step needs node_modules
      # (audit reads package-lock.json; the scan reads git + fs only).
      - name: Secret scan (fail-closed)
        run: node scripts/security-grep.js

      - name: Dependency audit (critical gate + full report)
        run: |
          npm audit --audit-level=critical
          npm audit || true

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Typecheck workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Test workspaces with coverage
        run: npm run test --workspaces --if-present -- --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Build workspaces
        run: npm run build --workspaces --if-present
        env:
          # Public API origin (no secret, no path — frontend appends /api/v1/...
          # and /api/health itself) — the web build fails fast when
          # VITE_API_BASE_URL is absent from a production build, and the
          # admin build fails fast when NEXT_PUBLIC_API_BASE_URL is absent.
          VITE_API_BASE_URL: https://anatomiax-api.onrender.com
          NEXT_PUBLIC_API_BASE_URL: https://anatomiax-api.onrender.com

      - name: Prisma migration safety gate (DB-less, no mutation)
        run: node scripts/check-prisma-migrations.js

      - name: Deployment readiness (no secrets, provider-neutral)
        run: node scripts/check-production-readiness.js --check-builds

      - name: Anatomy asset contract (dev layout)
        run: node scripts/check-anatomy-assets.js --base /models-dev/

      # The viewer E2E suite loads real GLBs from the dev server. Fresh
      # clones lack the gitignored models-dev/ subset (the dev server then
      # serves index.html for .glb paths and the loader fails), so populate
      # the documented 13-file subset before Playwright runs.
      - name: Populate dev GLB subset for viewer E2E
        run: node scripts/populate-dev-assets.js

      - name: Performance budget (informational warnings)
        run: node scripts/check-performance-budget.js

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npx playwright test --reporter=list
        env:
          CI: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage
            frontend/web/coverage
            frontend/admin/coverage
            backend/api/coverage
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
